<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Programming Languages</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 32px;
        }

        .container {
            width: 80%;
            max-width: 1200px;
            min-height: 300px;

            border-radius: 20px;

            display: grid;
            grid-template-columns: repeat(4, 1fr);

            gap: 20px;
            padding: 20px;
        }

        .box {
            width: 100%;
            height: 220px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 15px;
            overflow: hidden;
        }

        .box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }


        /* =========================
           TABLET VIEW
           768px - 1024px
           ========================= */

        @media screen and (max-width: 1024px) {

            h1 {
                font-size: 28px;
            }

            .container {
                width: 90%;
                grid-template-columns: repeat(2, 1fr);
                gap: 20px;
            }

            .box {
                height: 200px;
            }
        }


        /* =========================
           MOBILE VIEW
           Below 768px
           ========================= */

        @media screen and (max-width: 767px) {

            body {
                padding: 15px;
            }

            h1 {
                font-size: 24px;
                margin-bottom: 15px;
            }

            .container {
                width: 100%;

                grid-template-columns: 1fr;

                gap: 15px;
                padding: 10px;
            }

            .box {
                height: 200px;
            }
        }


        /* =========================
           SMALL MOBILE
           Below 480px
           ========================= */

        @media screen and (max-width: 480px) {

            h1 {
                font-size: 20px;
            }

            .container {
                gap: 10px;
            }

            .box {
                height: 170px;
            }
        }
    </style>
</head>

<body>

    <h1>This is Programming Language</h1>

    <div class="container">

        <div class="box">
            <img src="/images/-original-imahmybxkhzwryxm.webp"
                 alt="Programming Language">
        </div>

        <div class="box">
            <img src="/images/-original-imahmybxkhzwryxm.webp"
                 alt="Programming Language">
        </div>

        <div class="box">
            <img src="/images/-original-imahmybxkhzwryxm.webp"
                 alt="Programming Language">
        </div>

        <div class="box">
            <img src="/images/-original-imahmybxkhzwryxm.webp"
                 alt="Programming Language">
        </div>

    </div>

</body>

</html>
